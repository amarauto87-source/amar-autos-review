<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Enfield Riders Community | Registration</title>
<style>
  :root{
    --bg:#1b1714;
    --panel:#241f19;
    --field:#2c2620;
    --gold:#d3a24f;
    --gold-light:#eec27a;
    --gold-dim:#a17f42;
    --text:#f7f2e9;
    --text-muted:#c2b7a6;
    --border:rgba(211,162,79,0.35);
    --danger:#e2574c;
    --success:#4caf6a;
    --font-head:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.brand,.headline{font-family:var(--font-head); text-transform:uppercase; letter-spacing:1px; font-weight:700;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  .icon{width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em; flex:none;}
  .filled{fill:currentColor; stroke:none;}

  /* Header */
  header.site{ position:sticky; top:0; z-index:50; background:rgba(11,10,9,0.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); }
  header.site .wrap{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .brand{font-size:22px; font-weight:700; letter-spacing:2px;}
  .brand span{color:var(--gold-light);}
  .btn-register{ border:1px solid var(--gold); color:var(--gold-light); padding:9px 18px; border-radius:3px; font-family:var(--font-head); font-size:12.5px; font-weight:700; cursor:pointer; }
  .btn-register:hover{background:var(--gold); color:#161310;}

  /* Hero */
  .hero{ position:relative; padding:120px 0 60px; border-bottom:1px solid var(--border); background:var(--bg); overflow:hidden;}
  .hero-bg{ position:absolute; inset:0; z-index:0; background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=1600&q=80'); background-size:cover; background-position:center; }
  .hero .wrap{position:relative; z-index:2;}
  .headline{font-size:52px; line-height:1.08;}
  .headline .accent{color:var(--gold-light); display:block;}

  /* Form */
  .form-section{padding:56px 0 40px;}
  .form-card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:40px; }
  form#riderForm{display:grid; grid-template-columns:repeat(2, 1fr); gap:20px;}
  .field{display:flex; flex-direction:column; gap:8px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-family:var(--font-head); font-size:12px; color:var(--text); font-weight:600; text-transform:uppercase;}
  .input-wrap{ background:var(--field); border:1px solid var(--border); border-radius:5px; display:flex; align-items:center;}
  input, select{ flex:1; background:transparent; border:none; color:var(--text); padding:12px; }
  .field.disabled{opacity:0.5; pointer-events:none;}
  .submit-btn{ background:linear-gradient(180deg, var(--gold-light), var(--gold)); color:#181410; padding:15px 40px; border-radius:5px; border:none; font-weight:700; cursor:pointer; grid-column:1 / -1;}
  .field-error{color:var(--danger); font-size:11px; display:none;}
  .invalid .field-error{display:block;}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="brand">ROYAL <span>ENFIELD</span></div>
    <a href="#riderForm" class="btn-register">Register</a>
  </div>
</header>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="wrap">
    <h1 class="headline">Ride Together<span class="accent">Stay Together</span></h1>
    <p>Join our rider community by filling the registration form.</p>
  </div>
</section>

<section class="form-section">
  <div class="wrap">
    <div class="form-card">
      <h2>Rider Registration Form</h2>
      <br>
      <form id="riderForm" novalidate>
        <div class="field"><label>Rider Name *</label><div class="input-wrap"><input type="text" name="Rider Name" required></div><span class="field-error">Required</span></div>
        <div class="field"><label>Mobile Number *</label><div class="input-wrap"><input type="tel" name="Mobile Number" required></div><span class="field-error">Required</span></div>
        <div class="field"><label>Emergency Contact *</label><div class="input-wrap"><input type="tel" name="Emergency Contact Number" required></div><span class="field-error">Required</span></div>
        <div class="field"><label>Bike Model *</label><div class="input-wrap"><input type="text" name="Bike Model" required></div><span class="field-error">Required</span></div>
        <div class="field"><label>Registration No. *</label><div class="input-wrap"><input type="text" name="Bike Registration Number" required></div><span class="field-error">Required</span></div>
        <div class="field"><label>Riding Experience *</label><div class="input-wrap"><select name="Riding Experience" required><option value="">Select...</option><option>Beginner</option><option>Intermediate</option><option>Expert</option></select></div></div>
        <div class="field"><label>Member of Group? *</label><div class="input-wrap"><select id="groupMember" name="Already Member of Riding Group" required><option value="No">No</option><option value="Yes">Yes</option></select></div></div>
        <div class="field disabled" id="groupNameField"><label>If Yes, Group Name</label><div class="input-wrap"><input type="text" name="Riding Group Name" id="groupName" disabled></div></div>
        <div class="field"><label>City *</label><div class="input-wrap"><input type="text" name="City / Location" required></div></div>
        <div class="field"><label>DOB *</label><div class="input-wrap"><input type="date" name="Date of Birth" required></div></div>
        <div class="field full"><label>Address *</label><div class="input-wrap"><input type="text" name="Address" required></div></div>
        <button type="submit" class="submit-btn" id="submitBtn">Submit Registration</button>
      </form>
      <div id="formStatus" style="margin-top:20px; text-align:center;"></div>
    </div>
  </div>
</section>

<script>
  // URL Update ho gaya hai
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2OFBToUugUA9wqp5t8LFjkeKX_Ib1FPJP93NxM6n9a3tt4er2t7xsNQ4rSJUjDxBe/exec";

  // Group Name Toggle
  document.getElementById('groupMember').addEventListener('change', function(){
    var isYes = this.value === 'Yes';
    document.getElementById('groupNameField').classList.toggle('disabled', !isYes);
    document.getElementById('groupName').disabled = !isYes;
  });

  // Form Submit
  document.getElementById('riderForm').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var status = document.getElementById('formStatus');
    
    btn.disabled = true;
    status.textContent = "Submitting...";

    var data = {};
    new FormData(this).forEach(function(v, k){ data[k] = v; });
    data['Submission Time'] = new Date().toLocaleString();

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(data)
    })
    .then(function(){
      status.textContent = "Success! Data saved.";
      btn.disabled = false;
    })
    .catch(function(){
      status.textContent = "Error occurred.";
      btn.disabled = false;
    });
  });
</script>
</body>
</html>
