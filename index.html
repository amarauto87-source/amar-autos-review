<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Autos - Leave a Review</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 20px; padding-bottom: 30px; background-color: #f8f9fa; margin: 0;}
        .review-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 90%;}
        h2 { margin-bottom: 5px; color: #333; font-size: 22px;}
        p { color: #666; margin-bottom: 15px; font-size: 14px;}
        
        /* Stars Styling */
        .stars { font-size: 35px; cursor: pointer; color: #e0e0e0; margin-bottom: 15px; user-select: none;}
        .stars span:hover, .stars span.active { color: #ffc107; } 
        
        /* Input Fields for Model & Sales Person */
        .input-group { display: none; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; text-align: left; }
        .input-group input { flex: 1; min-width: 45%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box;}
        .input-group input:focus { border-color: #ffc107; outline: none; }

        /* Tags (Keywords) Styling */
        .tags-container { display: none; margin-bottom: 20px; text-align: center;}
        .tags-title { font-size: 14px; font-weight: bold; margin-bottom: 12px; color: #444; }
        .tags-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .tag { padding: 8px 12px; background: #f1f1f1; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; font-size: 13px; transition: 0.2s; color: #333; user-select: none;}
        .tag.active { background: #ffc107; color: #000; border-color: #ffc107; font-weight: bold;}
        .show-more-btn { width: 100%; margin-top: 10px; font-weight: bold; color: #007bff; cursor: pointer; font-size: 14px; user-select: none; }
        .show-more-btn:hover { text-decoration: underline; }

        /* Textarea */
        textarea { width: 100%; height: 120px; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; resize: none; font-size: 14px; box-sizing: border-box; line-height: 1.5; background-color: #fafafa;}
        
        /* Buttons */
        .button-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;}
        button { padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;}
        .btn-copy { background: #000; color: #fff; }
        .btn-copy:hover { background: #333; }
        .btn-google { background: #ffc107; color: #000; }
        .btn-google:hover { background: #ffb300; }
    </style>
</head>
<body>

<div class="review-card">
    <h2>Royal Enfield - Amar Autos</h2>
    <p>Please rate your experience</p>

    <!-- Star Rating -->
    <div class="stars" id="star-container">
        <span data-value="1">★</span>
        <span data-value="2">★</span>
        <span data-value="3">★</span>
        <span data-value="4">★</span>
        <span data-value="5">★</span>
    </div>

    <!-- Manual Inputs: Model & Salesperson -->
    <div class="input-group" id="input-group">
        <input type="text" id="model-name" placeholder="Bike Model (e.g. Classic 350)" oninput="updateReviewBox()">
        <input type="text" id="sales-person" placeholder="Sales Person Name (Optional)" oninput="updateReviewBox()">
    </div>

    <!-- Tags / Keywords Options -->
    <div class="tags-container" id="tags-container">
        <div class="tags-title">What did you like? (Select options)</div>
        <div class="tags-list" id="tags-list">
            <!-- Tags dynamically generated here -->
        </div>
    </div>

    <!-- Review Text Box -->
    <textarea id="review-box" placeholder="Select stars to start generating a review..." readonly></textarea>

    <!-- Buttons -->
    <div class="button-group">
        <button class="btn-copy" onclick="copyReview()">Copy Review</button>
        <button class="btn-google" onclick="openGoogle()">Open Google Review</button>
    </div>
</div>

<script>
    // Keyword Database
    const reviewData = {
        positive: {
            prefix: "I had a wonderful experience at Amar Autos! ",
            options: [
                { keyword: "Friendly Staff", sentence: "The staff was very friendly and welcoming." },
                { keyword: "Product Knowledge", sentence: "They have excellent product knowledge and answered all my queries." },
                { keyword: "Helpful Guidance", sentence: "I received helpful guidance in choosing the right bike for me." },
                { keyword: "Quick Response", sentence: "The team was quick to respond to all my questions." },
                { keyword: "Test Ride Experience", sentence: "The test ride experience was fantastic and well-organized." },
                { keyword: "Smooth Purchase Experience", sentence: "The entire purchase experience was incredibly smooth." },
                { keyword: "On-Time Delivery", sentence: "The delivery was right on time as promised." },
                { keyword: "Bike Features Explained Well", sentence: "All the bike features were explained to me very clearly." },
                { keyword: "Accessories Guidance", sentence: "They provided great guidance on selecting the best accessories." },
                { keyword: "Finance Support", sentence: "The finance support was excellent and made the process easy." },
                { keyword: "Hassle-Free Paperwork", sentence: "The paperwork was completely hassle-free." },
                { keyword: "Excellent Customer Service", sentence: "I experienced excellent customer service throughout." },
                { keyword: "Great Buying Experience", sentence: "Overall, it was a great buying experience." },
                { keyword: "Highly Recommended", sentence: "I highly recommend Amar Autos to everyone." },
                { keyword: "Exceeded Expectations", sentence: "The service totally exceeded my expectations." }
            ]
        },
        neutral: {
            prefix: "My experience at Amar Autos was okay. ",
            options: [
                { keyword: "Decent Staff", sentence: "The staff behavior was decent." },
                { keyword: "Slow Paperwork", sentence: "The documentation process took more time than expected." },
                { keyword: "Got the Bike", sentence: "I got my bike delivered, but waiting time was long." }
            ]
        },
        negative: {
            prefix: "I am disappointed with the service at Amar Autos. ",
            options: [
                { keyword: "Rude Behavior", sentence: "The sales team was quite unprofessional." },
                { keyword: "Delayed Delivery", sentence: "My bike delivery was delayed." },
                { keyword: "Poor Support", sentence: "After-sales support needs improvement." }
            ]
        }
    };

    const stars = document.querySelectorAll('.stars span');
    const tagsContainer = document.getElementById('tags-container');
    const tagsList = document.getElementById('tags-list');
    const tagsTitle = document.querySelector('.tags-title');
    const inputGroup = document.getElementById('input-group');
    const modelInput = document.getElementById('model-name');
    const salesInput = document.getElementById('sales-person');
    const reviewBox = document.getElementById('review-box');

    let currentPrefix = "";
    let selectedSentences = [];
    let isPositive = false;

    // Star Click Logic
    stars.forEach(star => {
        star.addEventListener('click', function() {
            const rating = parseInt(this.getAttribute('data-value'));

            // Highlight stars
            stars.forEach(s => s.classList.remove('active'));
            for(let i = 0; i < rating; i++) {
                stars[i].classList.add('active');
            }

            // Show Inputs
            inputGroup.style.display = "flex";

            // Decide which category to load
            let categoryData;
            if (rating >= 4) {
                categoryData = reviewData.positive;
                tagsTitle.innerText = "What did you like the most? (Select options)";
                isPositive = true;
            } else if (rating === 3) {
                categoryData = reviewData.neutral;
                tagsTitle.innerText = "What could be better? (Select options)";
                isPositive = false;
            } else {
                categoryData = reviewData.negative;
                tagsTitle.innerText = "What went wrong? (Select options)";
                isPositive = false;
            }

            currentPrefix = categoryData.prefix;
            selectedSentences = [];
            updateReviewBox();

            // Render Tags
            tagsContainer.style.display = "block";
            tagsList.innerHTML = ""; 

            let isExpanded = false;

            categoryData.options.forEach((opt, index) => {
                const tagBtn = document.createElement('div');
                tagBtn.className = 'tag';
                
                // Pehle sirf 6 options dikhayenge
                if(index >= 6) {
                    tagBtn.style.display = 'none';
                    tagBtn.classList.add('hidden-tag');
                }

                tagBtn.innerText = opt.keyword;
                
                tagBtn.addEventListener('click', function() {
                    this.classList.toggle('active');
                    if (this.classList.contains('active')) {
                        selectedSentences.push(opt.sentence);
                    } else {
                        selectedSentences = selectedSentences.filter(s => s !== opt.sentence);
                    }
                    updateReviewBox();
                });

                tagsList.appendChild(tagBtn);
            });

            // Show More Options Button 
            if(categoryData.options.length > 6) {
                const showMoreBtn = document.createElement('div');
                showMoreBtn.className = 'show-more-btn';
                showMoreBtn.innerText = '☐ Show More Options';
                showMoreBtn.onclick = function() {
                    isExpanded = !isExpanded;
                    document.querySelectorAll('.hidden-tag').forEach(el => {
                        el.style.display = isExpanded ? 'block' : 'none';
                    });
                    this.innerText = isExpanded ? '☑ Show Less Options' : '☐ Show More Options';
                };
                tagsList.appendChild(showMoreBtn);
            }
        });
    });

    // Smart Box Updater
    function updateReviewBox() {
        let finalReview = "";
        const mName = modelInput.value.trim();
        const sName = salesInput.value.trim();

        // Agar 4 ya 5 star hai aur Model name likha hai
        if (isPositive) {
            if (mName !== "") {
                finalReview = `I had a wonderful experience buying my ${mName} at Amar Autos! `;
            } else {
                finalReview = currentPrefix;
            }
        } else {
            finalReview = currentPrefix;
            if (mName !== "") {
                finalReview += `(Model: ${mName}) `;
            }
        }

        // Tags ke sentences add karna (Bina faltu bracket text ke)
        if (selectedSentences.length > 0) {
            finalReview += selectedSentences.join(" ") + " ";
        }

        // Agar Sales Person ka naam likha hai toh end me add karein
        if (sName !== "") {
            finalReview += `Special thanks to ${sName} for the excellent support and assistance.`;
        }

        reviewBox.value = finalReview.trim();
    }

    // Copy Button Logic
    function copyReview() {
        if(reviewBox.value.trim() === "") {
            alert("Please select a rating first!");
            return;
        }
        reviewBox.select();
        document.execCommand("copy");
        alert("Review copied! Now paste it on Google.");
    }

    // Google Review Open Logic
    function openGoogle() {
        window.open("https://royalenfield.interactiveavenues.net/web/pages/qr/qrTracker.jsp?client_name=re&dealer_id=9110000960&review_url=https://search.google.com/local/writereview?placeid=ChIJZWy1kIP8DDkRF1GgIgnOueA", "_blank");
    }
</script>

</body>
</html>
