    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function triggerSparkles(element) {
        const rect = element.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        for (let i = 0; i < 20; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            document.body.appendChild(sparkle);

            const colors = ['#E5A93C', '#ffca28', '#ff9800', '#fff59d'];
            sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            sparkle.style.left = centerX + 'px';
            sparkle.style.top = centerY + 'px';

            const speed = 2 + Math.random() * 5;
            const angle = Math.random() * Math.PI * 2;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;

            let opacity = 1;
            let posX = centerX;
            let posY = centerY;

            const animateParticle = () => {
                if (opacity <= 0) {
                    sparkle.remove();
                    return;
                }
                posX += vx;
                posY += vy + 0.5;
                opacity -= 0.02;

                sparkle.style.left = posX + 'px';
                sparkle.style.top = posY + 'px';
                sparkle.style.opacity = opacity;
                sparkle.style.transform = `scale(${opacity * 1.5})`;

                requestAnimationFrame(animateParticle);
            };
            requestAnimationFrame(animateParticle);
        }

    const stars = document.querySelectorAll('.stars span');

    function updatePlaceholders() {
        document.getElementById('model-placeholder').innerText = isHindi ? "बाइक का मॉडल चुनें" : "Select Bike Model";
        document.getElementById('sales-placeholder').innerText = isHindi ? "सेल्स पर्सन चुनें" : "Select Sales Person";
        document.getElementById('whatsapp-number').placeholder = isHindi ? "अपना 10-अंकों का WhatsApp नंबर डालें" : "Enter 10-digit WhatsApp Number";
    }

    function toggleLanguage() {
        isHindi = !isHindi;
        document.getElementById('lang-en').classList.toggle('active');
        document.getElementById('lang-hi').classList.toggle('active');

        document.getElementById('subtitle-text').innerText = isHindi ? "आपका फीडबैक हमारे लिए ज़रूरी है!" : "Your feedback helps us improve!";
        document.getElementById('community-title').innerText = isHindi ? "क्या आप हमारे राइडिंग ग्रुप से जुड़ना चाहेंगे?" : "Would you like to join our Riding Group?";
        document.getElementById('stars-title').innerText = isHindi ? "कृपया अपना अनुभव रेट करें:" : "Please rate your experience:";
        document.getElementById('btn-copy').innerText = isHindi ? "रिव्यु कॉपी करें" : "Copy Draft";
        btnGoogle.innerText = isHindi ? "गूगल पर रिव्यु दें" : "Open Google Review";
        btnWhatsapp.innerText = isHindi ? "समस्या है? मैनेजर से बात करें" : "Issue? Talk to Manager";
        hintText.innerText = isHindi ? "📝 आप चाहें तो नीचे अपने शब्द लिख सकते हैं:" : "📝 You can edit this text below:";

        updatePlaceholders();
        if(currentRating > 0) renderTags(currentRating);
        updateReviewBox();
    }

    stars.forEach(star => {
        star.addEventListener('click', function() {
            currentRating = parseInt(this.getAttribute('data-value'));
            selectedTagsData = []; 
            dataSaved = false; 
            customEdit = false; 
            
            // Randomly select a default base index each time a star is clicked
            defaultReviewIndex = Math.floor(Math.random() * 3);
            
            stars.forEach(s => s.classList.remove('active'));
            for(let i = 0; i < currentRating; i++) {
                stars[i].classList.add('active');
            }

            if(currentRating === 5) {
                triggerSparkles(this.parentElement);
            }

            inputGroup.style.display = "flex";
            inputGroup.classList.add("animate-slide-up");
            
            hintText.style.display = "block";
            hintText.classList.add("animate-block-up");
            
            updatePlaceholders();
            renderTags(currentRating);
            updateButtons(currentRating);
            updateReviewBox(); 
        });
    });

    function renderTags(rating) {
        let category;
        if (rating >= 4) {
            category = reviewData.positive;
            tagsTitle.innerText = isHindi ? "आपको सबसे अच्छा क्या लगा? (विकल्प चुनें)" : "What did you like the most? (Select options)";
        } else if (rating === 3) {
            category = reviewData.neutral;
            tagsTitle.innerText = isHindi ? "क्या बेहतर हो सकता था? (विकल्प चुनें)" : "What could be better? (Select options)";
        } else {
            category = reviewData.negative;
            tagsTitle.innerText = isHindi ? "क्या समस्या आई? (विकल्प चुनें)" : "What went wrong? (Select options)";
        }

        tagsContainer.style.display = "block";
        tagsContainer.classList.add("animate-block-up");
        tagsList.innerHTML = ""; 

        let shuffledCategory = shuffleArray(category);

        shuffledCategory.forEach((opt) => {
            const tagBtn = document.createElement('div');
            tagBtn.className = 'tag';
            tagBtn.innerText = isHindi ? opt.tagHi : opt.tagEn;
            
            let isSelected = selectedTagsData.some(item => item.tagEn === opt.tagEn);
            if(isSelected) tagBtn.classList.add('active');

            tagBtn.addEventListener('click', function() {
                customEdit = false; 
                this.classList.toggle('active');
                
                if (this.classList.contains('active')) {
                    let randOpen = Math.floor(Math.random() * opt.openEn.length);
                    let randBody = Math.floor(Math.random() * opt.bodyEn.length);
                    selectedTagsData.push({
                        tagEn: opt.tagEn, tagHi: opt.tagHi,
                        pickedOpenEn: opt.openEn[randOpen], pickedOpenHi: opt.openHi[randOpen],
                        pickedBodyEn: opt.bodyEn[randBody], pickedBodyHi: opt.bodyHi[randBody]
                    });
                } else {
                    selectedTagsData = selectedTagsData.filter(item => item.tagEn !== opt.tagEn);
                }
                updateReviewBox();
            });
            tagsList.appendChild(tagBtn);
        });
    }

    function updateButtons(rating) {
        btnGoogle.style.display = "block";
        document.getElementById('btn-copy').style.display = "block";
        if (rating <= 3) {
            btnWhatsapp.style.display = "block";
        } else {
            btnWhatsapp.style.display = "none";
        }
    }

    function updateReviewBox() {
        if(currentRating === 0 || customEdit) return; 

        let mName = modelInput.value;
        let modelReplacement = mName !== "" && mName !== "Other" ? mName : (isHindi ? "बाइक" : "bike");
        let finalReview = "";

        if (selectedTagsData.length > 0) {
            let firstTag = selectedTagsData[0];
            let opening = isHindi ? firstTag.pickedOpenHi : firstTag.pickedOpenEn;
            opening = opening.replace("{MODEL}", modelReplacement);
            finalReview += opening;

            selectedTagsData.forEach(tag => { 
                finalReview += (isHindi ? tag.pickedBodyHi : tag.pickedBodyEn); 
            });
        } else {
            // Arrays of natural defaults for when NO tags are selected yet
            let defaultsPosEn = [
                `Great experience purchasing my ${modelReplacement} from Amar Autos. Highly recommend this showroom! `,
                `Absolutely loved the service at Amar Autos while buying my ${modelReplacement}. Great team! `,
                `Very smooth and pleasant experience getting my new ${modelReplacement} here. `
            ];
            let defaultsPosHi = [
                `अमर ऑटोस से ${modelReplacement} खरीदने का अनुभव शानदार रहा। शोरूम की सर्विस बहुत बढ़िया है। `,
                `मैंने अपनी ${modelReplacement} अमर ऑटोस से ली और मैं इनकी सर्विस से बहुत खुश हूँ। `,
                `मेरी नई ${modelReplacement} के लिए अमर ऑटोस सबसे अच्छी जगह साबित हुई। शानदार टीम! `
            ];

            let defaultsNeuEn = [
                `My experience with Amar Autos for ${modelReplacement} was okay. `,
                `Average experience buying my ${modelReplacement} from Amar Autos. `,
                `The purchase process for my ${modelReplacement} went fine. `
            ];
            let defaultsNeuHi = [
                `अमर ऑटोस से ${modelReplacement} लेने का अनुभव ठीक था। `,
                `मेरी ${modelReplacement} की खरीदारी का अनुभव साधारण रहा। `,
                `${modelReplacement} का काम ठीक-ठाक तरीके से हो गया। `
            ];

            let defaultsNegEn = [
                `Had some issues with Amar Autos during my ${modelReplacement} purchase. `,
                `Disappointing experience with Amar Autos for my ${modelReplacement}. `,
                `Not happy with the service received for my ${modelReplacement}. `
            ];
            let defaultsNegHi = [
                `अमर ऑटोस से ${modelReplacement} लेने में परेशानी आई। `,
                `अमर ऑटोस से ${modelReplacement} का अनुभव निराशाजनक रहा। `,
                `अपनी ${modelReplacement} की सर्विस से मैं बिल्कुल संतुष्ट नहीं हूँ। `
            ];

            if (currentRating >= 4) {
                finalReview = isHindi ? defaultsPosHi[defaultReviewIndex] : defaultsPosEn[defaultReviewIndex];
            } else if (currentRating === 3) {
                finalReview = isHindi ? defaultsNeuHi[defaultReviewIndex] : defaultsNeuEn[defaultReviewIndex];
            } else {
                finalReview = isHindi ? defaultsNegHi[defaultReviewIndex] : defaultsNegEn[defaultReviewIndex];
            }
        }
        
        reviewBox.value = finalReview;
    }

    function isNumberValid() {
        if(joinRidingGroup === "Yes") {
            const wpNum = document.getElementById('whatsapp-number').value;
            if(wpNum.length < 10) {
                alert(isHindi ? "कृपया सही 10-अंकों का WhatsApp नंबर डालें!" : "Please enter a valid 10-digit WhatsApp number!");
                document.getElementById('whatsapp-number').focus();
                return false;
            }
        }
        return true;
    }

    function saveToGoogleSheets() {
        if (dataSaved || currentRating === 0) return;
        dataSaved = true;

        const mName = modelInput.value;
        const sName = salesInput.value;
        const tagsString = selectedTagsData.map(item => isHindi ? item.tagHi : item.tagEn).join(", ");
        const rText = reviewBox.value;
        const wpNumber = document.getElementById('whatsapp-number').value || "N/A";

        const payload = {
            rating: currentRating,
            model: mName || "N/A",
            salesPerson: sName || "N/A",
            tags: tagsString || "None",
            reviewText: rText,
            ridingGroup: joinRidingGroup,
            whatsappNumber: wpNumber
        };

        const scriptUrl = "https://script.google.com/macros/s/AKfycbxSiHkYveOOOJd22j3aEDpvsWnmgFgTNgGy7K5QTZiAK7N9GK_5M3A875M-3ylw0xc_/exec";

        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(err => console.log("Data Save Error:", err));
    }

    function copyReview() {
        if(!isNumberValid()) return;
        if (currentRating >= 4 && salesInput.value === "") {
            alert(isHindi ? "कृपया आगे बढ़ने के लिए सेल्स पर्सन का नाम चुनें!" : "Please select a Sales Person to proceed!");
            salesInput.focus();
            return;
        }
        reviewBox.select();
        document.execCommand("copy");
        alert(isHindi ? "रिव्यु कॉपी हो गया!" : "Review copied!");
    }

    function openGoogle() {
        if(!isNumberValid()) return;
        if (currentRating >= 4 && salesInput.value === "") {
            alert(isHindi ? "कृपया आगे बढ़ने के लिए सेल्स पर्सन का नाम चुनें!" : "Please select a Sales Person to proceed!");
            salesInput.focus();
            return;
        }
        
        copyReview();
        saveToGoogleSheets(); 
        window.open("https://royalenfield.interactiveavenues.net/web/pages/qr/qrTracker.jsp?client_name=re&dealer_id=9110000960&review_url=https://search.google.com/local/writereview?placeid=ChIJZWy1kIP8DDkRF1GgIgnOueA", "_blank");
    }

    function sendToWhatsApp() {
        if(!isNumberValid()) return;
        
        saveToGoogleSheets(); 
        const managerNumber = "918448988950"; 
        const message = encodeURIComponent((isHindi ? "मैनेजर ध्यान दें, नया फीडबैक: \n\n" : "Manager Alert, New Feedback: \n\n") + reviewBox.value);
        window.open(`https://wa.me/${managerNumber}?text=${message}`, "_blank");
    }
</script>
