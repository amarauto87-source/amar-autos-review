<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amar Autos Review</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

.logo{
text-align:center;
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.sub{
text-align:center;
color:#666;
margin-bottom:20px;
}

.stars{
display:flex;
justify-content:center;
gap:10px;
margin:20px 0;
}

.star{
font-size:55px;
cursor:pointer;
color:#ccc;
}

.active{
color:#f7b500;
}

textarea{
width:100%;
min-height:180px;
padding:15px;
font-size:16px;
border-radius:10px;
border:1px solid #ddd;
resize:none;
}

button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
background:#f7b500;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
Royal Enfield Showroom<br>
Amar Autos
</div>

<div class="sub">
How was your experience today?
</div>

<div class="stars">
<span class="star" onclick="setRating(1)">★</span>
<span class="star" onclick="setRating(2)">★</span>
<span class="star" onclick="setRating(3)">★</span>
<span class="star" onclick="setRating(4)">★</span>
<span class="star" onclick="setRating(5)">★</span>
</div>

<textarea id="reviewBox" readonly>
Please select a rating.
</textarea>

<button onclick="submitReview()">
Submit Review
</button>

</div>

<script>

let selectedPrompt = "";

const prompts = [

"Describe your overall experience at Amar Autos.",
"What did you like most about your visit today?",
"How was your interaction with the showroom staff?",
"Was the booking and delivery process smooth?",
"How well were the motorcycle features explained to you?",
"How was the behaviour of the team during your visit?",
"Did you receive timely updates regarding your booking?",
"What made your experience memorable?",
"How was the showroom environment and hospitality?",
"Would you recommend Amar Autos to your friends and family? Why?",
"How satisfied are you with the guidance provided during your purchase?",
"How was your experience with documentation and paperwork?",
"Did the staff answer your questions clearly?",
"How was your delivery day experience?",
"How did the team help you choose the right motorcycle?",
"How was your overall Royal Enfield buying experience?",
"How helpful was the sales process from start to finish?",
"What impressed you most during your visit?",
"How was your experience compared to other dealerships?",
"Share your honest feedback about your experience at Amar Autos."

];

function setRating(rating){

document.querySelectorAll('.star').forEach((s,index)=>{
if(index<rating){
s.classList.add('active');
}else{
s.classList.remove('active');
}
});

selectedPrompt =
prompts[Math.floor(Math.random()*prompts.length)];

document.getElementById("reviewBox").value =
selectedPrompt;
}

function submitReview(){

if(selectedPrompt===""){
alert("Please select a rating first.");
return;
}

navigator.clipboard.writeText(selectedPrompt);

window.open(
"https://search.google.com/local/writereview?placeid=ChIJZWy1kIP8DDkRF1GgIgnOueA",
"_blank"
);

}
</script>

</body>
</html>
